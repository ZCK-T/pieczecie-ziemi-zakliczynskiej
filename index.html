<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6B45">
<meta name="description" content="Gra terenowa Zakliczyńskiego Centrum Kultury po Zakliczynie i okolicy: zamek w Melsztynie, rynek z ratuszem, klasztor franciszkanów i Lusławice. Zbierzcie pieczęcie i odbierzcie certyfikat.">
<meta name="author" content="Tomasz Zawisza">
<meta property="og:type" content="website">
<meta property="og:locale" content="pl_PL">
<meta property="og:title" content="Pieczęcie Ziemi Zakliczyńskiej: gra terenowa">
<meta property="og:description" content="Gra terenowa Zakliczyńskiego Centrum Kultury po Zakliczynie i okolicy. Zbierzcie pieczęcie i odbierzcie certyfikat.">
<style>img{max-width:100%}</style>
<title>Pieczęcie Ziemi Zakliczyńskiej: gra terenowa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Grenze+Gotisch:wght@700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   KOLORY: jasne, czytelne w słońcu. Zieleń = działanie,
   słoneczny żółty = bieżący cel, błękit = wasza pozycja,
   czerwony lak = pieczęcie miejsc, fioletowy tusz = pieczątki.
   ========================================================= */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --tlo:#F2F6F1; --karta:#FFFFFF; --karta-2:#F6FAF5; --tekst:#15231A; --tekst-2:#56645B;
  --linia:#DCE6DE; --kamien:#8E9A92;
  --zielen:#1E6B45; --zielen-2:#155336; --zielen-jasna:#E3F2E8; --na-zieleni:#FFFFFF;
  --slonce:#F2B23A; --slonce-jasne:#FFF4D9; --slonce-tekst:#6B4700;
  --niebo:#2A7DE1; --niebo-jasne:#E4EFFD;
  --wosk:#B3261E; --wosk-ciemny:#6E1210; --wosk-blask:#E0675C;
  --tusz:#3A4BA6;
  --ok:#1E7A45; --ok-tlo:#E2F4E8; --blad:#B42318; --blad-tlo:#FDECEA;
  --cien-1:0 1px 2px rgba(16,36,27,.05),0 4px 14px rgba(16,36,27,.06);
  --cien-2:0 14px 40px rgba(16,36,27,.18);
  --r:16px;
  --plakietka:#FFFFFF; --papier:#FFFDF6; --zloto:#B8892B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tlo:#0E1511; --karta:#17211B; --karta-2:#1C2821; --tekst:#E7EFE9; --tekst-2:#A6B4AB;
    --linia:#2A3930; --kamien:#7E8C83;
    --zielen:#5CC48B; --zielen-2:#7DD4A3; --zielen-jasna:#183024; --na-zieleni:#08140D;
    --slonce:#F2B23A; --slonce-jasne:#382B12; --slonce-tekst:#FFD98A;
    --niebo:#6AA8F5; --niebo-jasne:#15263A;
    --wosk:#C8352C; --wosk-ciemny:#6E1210; --wosk-blask:#EE8378;
    --tusz:#9DAAF2;
    --ok:#6FD39A; --ok-tlo:#15301F; --blad:#FF8A80; --blad-tlo:#3A1A17;
    --cien-1:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --cien-2:0 14px 40px rgba(0,0,0,.5);
    --plakietka:#F5F2EA; --papier:#F5F1E6; --zloto:#E2B65A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --tlo:#0E1511; --karta:#17211B; --karta-2:#1C2821; --tekst:#E7EFE9; --tekst-2:#A6B4AB;
  --linia:#2A3930; --kamien:#7E8C83;
  --zielen:#5CC48B; --zielen-2:#7DD4A3; --zielen-jasna:#183024; --na-zieleni:#08140D;
  --slonce:#F2B23A; --slonce-jasne:#382B12; --slonce-tekst:#FFD98A;
  --niebo:#6AA8F5; --niebo-jasne:#15263A;
  --wosk:#C8352C; --wosk-ciemny:#6E1210; --wosk-blask:#EE8378;
  --tusz:#9DAAF2;
  --ok:#6FD39A; --ok-tlo:#15301F; --blad:#FF8A80; --blad-tlo:#3A1A17;
  --cien-1:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --cien-2:0 14px 40px rgba(0,0,0,.5);
  --plakietka:#F5F2EA; --papier:#F5F1E6; --zloto:#E2B65A;
  color-scheme:dark;
}

/* ===== PODSTAWA ===== */
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--tlo);color:var(--tekst);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.55}
.aplikacja{max-width:40rem;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1}
body.z-nawigacja .aplikacja{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,8vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800;margin:1.6em 0 .55em}
h3{font-size:1.15rem;font-weight:700;margin:.15em 0 .6em}
h3:focus{outline:none}
p{margin:0 0 .8em}
a{color:var(--zielen)}
:focus-visible{outline:3px solid var(--niebo);outline-offset:2px;border-radius:6px}
.drobne{font-size:.93rem;color:var(--tekst-2)}
.ukryty{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sekcja{padding:18px 16px 8px}
.karta{background:var(--karta);border:1px solid var(--linia);border-radius:var(--r);box-shadow:var(--cien-1);padding:18px 16px}
.karta + .karta{margin-top:12px}

/* ===== NAGŁÓWEK ===== */
.naglowek{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--karta) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--linia);padding:10px 16px}
.nag-wiersz{display:flex;align-items:center;gap:10px}
.nag-znak{flex:0 0 34px;height:34px}
.nag-tekst{flex:1;min-width:0}
.nag-tytul{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.08rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nag-podtytul{font-size:.85rem;color:var(--tekst-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nag-punkty{flex:0 0 auto;background:var(--slonce-jasne);color:var(--slonce-tekst);font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.postep{height:5px;background:var(--linia);border-radius:3px;margin-top:9px;overflow:hidden}
.postep span{display:block;height:100%;background:var(--zielen);border-radius:3px;transition:width .4s ease}

/* ===== DOLNA NAWIGACJA ===== */
.nawigacja{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(40rem,100%);z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--karta);border-top:1px solid var(--linia);box-shadow:0 -6px 20px rgba(16,36,27,.07);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;background:none;color:var(--tekst-2);font:inherit;font-size:.78rem;font-weight:600;border-radius:12px;cursor:pointer}
.nav-btn svg{width:24px;height:24px}
.nav-btn[aria-current=page]{color:var(--zielen);background:var(--zielen-jasna)}

/* ===== EKRAN STARTOWY ===== */
.hero{background:var(--karta);border-bottom:1px solid var(--linia)}
.hero-ilu{display:block;width:100%;height:auto}
.hero-tresc{padding:18px 16px 22px}
.hero-tresc h1{margin:.1em 0 .25em}
.hero-lead{font-size:1.12rem;color:var(--tekst-2);margin-bottom:14px}
.chipy{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.chip{font-size:.85rem;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--zielen-jasna);color:var(--zielen-2)}
.kroki{list-style:none;margin:0;padding:0;counter-reset:krok;display:grid;gap:10px}
.kroki li{counter-increment:krok;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.kroki li::before{content:counter(krok);width:36px;height:36px;border-radius:50%;background:var(--zielen);color:var(--na-zieleni);display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",sans-serif}
.kroki b{display:block}
.kroki span{color:var(--tekst-2);font-size:.95rem}
.i-niebo{fill:#DCEFFB}.i-slonce{fill:#F6C552}.i-chmura{fill:#FFFFFF}.i-dal{fill:#C3E1CB}.i-wzgorze{fill:#83C298}.i-teren{fill:#A7D6B3}
.i-rzeka{fill:#79B7E6}.i-mur{fill:#939C95}.i-ciemny{fill:#4E5A53}.i-sciana{fill:#FFFDF7;stroke:#C9D2C8;stroke-width:1}.i-dachowka{fill:#C8573E}.i-kopula{fill:#3E5B4D}.i-zegar{fill:#FFFFFF;stroke:#3E5B4D;stroke-width:1.4}

/* ===== FORMULARZ ===== */
.pole{display:block;font-weight:700;margin:1.15em 0 .35em}
.gwiazdka{color:var(--wosk)}
input[type=text],input[type=password],input[type=tel],input[type=email],input[type=number]{
  width:100%;min-height:52px;padding:.65em .85em;font:inherit;color:var(--tekst);
  background:var(--karta);border:1.5px solid var(--linia);border-radius:12px;
}
input[aria-invalid=true]{border-color:var(--blad)}
input:focus-visible{outline:3px solid color-mix(in srgb,var(--niebo) 40%,transparent);outline-offset:0;border-color:var(--niebo)}
.pole-opis{font-size:.9rem;color:var(--tekst-2);margin:.3em 0 0}
.blad-pola{color:var(--blad);font-size:.93rem;font-weight:600;margin:.35em 0 0}
fieldset{border:0;padding:0;margin:1.3em 0 1em;min-width:0}
legend{font-weight:700;margin-bottom:.5em;padding:0;font-size:1.02rem}
.wybory{display:grid;gap:10px}
.wybor{display:block;cursor:pointer;position:relative}
.wybor input{position:absolute;opacity:0;width:1px;height:1px}
.wybor-tresc{display:block;padding:14px 16px 14px 52px;border:1.5px solid var(--linia);border-radius:14px;background:var(--karta);position:relative;transition:border-color .15s,box-shadow .15s}
.wybor-tresc::before{content:"";position:absolute;left:16px;top:17px;width:22px;height:22px;border-radius:50%;border:2px solid var(--kamien);background:var(--karta)}
.wybor input:checked + .wybor-tresc{border-color:var(--zielen);box-shadow:0 0 0 3px var(--zielen-jasna)}
.wybor input:checked + .wybor-tresc::before{border-color:var(--zielen);background:radial-gradient(circle,var(--zielen) 0 48%,var(--karta) 54%)}
.wybor input:focus-visible + .wybor-tresc{outline:3px solid var(--niebo);outline-offset:2px}
.wybor-nazwa{display:block;font-weight:700;font-size:1.08rem;font-family:"Bricolage Grotesque",sans-serif}
.wybor-opis{display:block;color:var(--tekst-2);font-size:.95rem;line-height:1.4}
.fakty{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fakt{font-size:.8rem;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--karta-2);border:1px solid var(--linia);color:var(--tekst-2)}
.wybor-pieczecie{display:flex;gap:4px;margin-bottom:8px}
.zgoda{display:flex;gap:12px;align-items:flex-start;margin:.9em 0;font-size:.98rem;line-height:1.45;cursor:pointer}
.zgoda input{width:22px;height:22px;margin-top:1px;flex:0 0 auto;accent-color:var(--zielen)}
.baner{background:var(--slonce-jasne);color:var(--slonce-tekst);border-radius:12px;padding:12px 14px;margin:1em 0;font-weight:500}
.rodo{font-size:.93rem;line-height:1.5}
.rodo p{margin:0 0 .6em}

/* ===== PRZYCISKI ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.7em 1.15em;border-radius:12px;border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.btn-glowny{background:var(--zielen);color:var(--na-zieleni)}
.btn-glowny:hover{background:var(--zielen-2)}
.btn-drugi{background:var(--karta);color:var(--tekst);border-color:var(--linia)}
.btn-drugi:hover{border-color:var(--kamien)}
.btn-slonce{background:var(--slonce);color:#3D2A00}
.btn-wosk{background:var(--wosk);color:#FFF6F2}
.btn-pelny{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.przyciski{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.przyciski .btn{flex:1 1 10rem}
.link{background:none;border:0;padding:.35em 0;font:inherit;font-weight:600;color:var(--zielen);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;text-align:left}
.ukryty:focus-visible + label{outline:3px solid var(--niebo);outline-offset:2px}

/* ===== TRASA: POSTĘP, CEL, OŚ CZASU ===== */
.podsumowanie{display:flex;align-items:center;gap:14px}
.podsumowanie .pieczecie-wiersz{display:flex;gap:4px;flex-wrap:wrap}
.cel{border:2px solid var(--slonce);background:linear-gradient(180deg,var(--slonce-jasne),var(--karta) 120px)}
.etykieta-cel{display:inline-block;font-size:.82rem;font-weight:700;color:var(--slonce-tekst);background:var(--slonce-jasne);border:1px solid var(--slonce);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.cel h2{margin:.1em 0 .2em;font-size:1.6rem}
.miejsce{color:var(--tekst-2);margin-bottom:.7em}
.zapowiedz{font-size:1.05rem}
.wskazowka{font-size:.95rem;border-left:3px solid var(--slonce);padding-left:12px;color:var(--tekst-2)}
.odl-na-zywo{display:flex;align-items:center;gap:10px;background:var(--niebo-jasne);border-radius:12px;padding:10px 12px;margin:10px 0 0;font-weight:600}
.odl-na-zywo svg{flex:0 0 30px;width:30px;height:30px;fill:var(--niebo)}
.os{list-style:none;padding:0;margin:8px 0 0;position:relative}
.os li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;position:relative}
.os li:not(:last-child)::after{content:"";position:absolute;left:21px;top:54px;bottom:-8px;width:2px;background:var(--linia)}
.os-znak{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;background:var(--karta);border:2px solid var(--linia);color:var(--tekst-2);position:relative;z-index:1}
.os li.aktualna .os-znak{background:var(--slonce);border-color:var(--slonce);color:#3D2A00}
.os li.zdobyta .os-znak{border:0;background:none}
.os-nazwa{font-weight:700;margin:0;line-height:1.3}
.os-status{margin:0;color:var(--tekst-2);font-size:.93rem}
.os .link{min-height:0;padding:.2em 0;font-size:.93rem}

/* ===== MAPA NA ŻYWO ===== */
.mapa-zywa{position:relative;height:min(62vh,540px);min-height:320px;border-radius:var(--r);overflow:hidden;background:#EAF1EA;border:1px solid var(--linia);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:var(--cien-1)}
.mapa-zywa:active{cursor:grabbing}
.mz-kafle{position:absolute;inset:0;overflow:hidden}
.mz-kafel{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;transition:opacity .2s;max-width:none;pointer-events:none}
.mz-kafel.wczytany{opacity:1}
.mz-nakladka{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mz-siatka{stroke:#D3E0D5;stroke-width:1}
.mz-linia{fill:none;stroke:var(--zielen);stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round;opacity:.85}
.mz-znacznik{pointer-events:auto;cursor:pointer}
.mz-pin{stroke:#fff;stroke-width:2}
.mz-znacznik.zablok .mz-pin{fill:#FFFFFF;stroke:#8E9A92}
.mz-znacznik.zablok .mz-nr{fill:#56645B}
.mz-znacznik.aktualna .mz-pin{fill:#F2B23A}
.mz-znacznik.aktualna .mz-nr{fill:#3D2A00}
.mz-znacznik.wybrany .mz-pin{stroke:#15231A;stroke-width:2.5}
.mz-nr{font:800 12px "Figtree",sans-serif;text-anchor:middle;dominant-baseline:central}
.mz-etykieta{font:700 12.5px "Figtree",sans-serif;fill:#15231A;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.mz-puls{fill:none;stroke:#F2B23A;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:puls 2s ease-out infinite}
@keyframes puls{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
.mz-dokladnosc{fill:rgba(42,125,225,.14);stroke:rgba(42,125,225,.45);stroke-width:1}
.mz-kierunek{fill:rgba(42,125,225,.28)}
.mz-ja{fill:#2A7DE1;stroke:#fff;stroke-width:3}
.mz-przyciski{position:absolute;right:10px;top:10px;display:grid;gap:8px}
.mz-btn{width:46px;height:46px;border-radius:12px;border:1px solid rgba(0,0,0,.08);background:#fff;color:#15231A;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;font:700 1.35rem/1 "Figtree",sans-serif}
.mz-btn svg{width:22px;height:22px}
.mz-btn.aktywny{background:#2A7DE1;color:#fff}
.mz-polnoc{position:absolute;left:10px;top:10px;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;font:800 .78rem "Figtree",sans-serif;color:#B3261E}
.mz-skala{position:absolute;left:10px;bottom:10px;font:600 .75rem "Figtree",sans-serif;color:#15231A}
.mz-skala span{display:block;height:6px;border:2px solid #15231A;border-top:0;margin-top:2px}
.mz-atrybucja{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.85);font-size:.7rem;padding:2px 6px;color:#333;border-top-left-radius:6px}
.mz-info{position:absolute;left:10px;right:66px;bottom:38px;background:rgba(255,255,255,.94);color:#15231A;border-radius:10px;padding:6px 9px;font-size:.75rem;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.panel-mapy{margin-top:12px}
.panel-naglowek{display:flex;gap:12px;align-items:center}
.panel-nr{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--karta-2);border:2px solid var(--linia)}
.panel-nr.aktualna{background:var(--slonce);border-color:var(--slonce);color:#3D2A00}
.panel-naglowek h2{margin:0;font-size:1.25rem}
.mz-odl{display:flex;gap:12px;align-items:center;margin-top:12px;background:var(--niebo-jasne);border-radius:12px;padding:12px}
.strzalka{flex:0 0 44px;width:44px;height:44px;fill:var(--niebo);transition:transform .3s ease}
.mz-odl-km{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.5rem;margin:0;line-height:1.1}
.punkty-lista{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.punkt-chip{min-height:44px;padding:.4em .8em;border-radius:999px;border:1.5px solid var(--linia);background:var(--karta);font:inherit;font-size:.92rem;font-weight:600;color:var(--tekst);cursor:pointer}
.punkt-chip[aria-pressed=true]{border-color:var(--zielen);background:var(--zielen-jasna);color:var(--zielen-2)}
.blisko{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;width:min(38rem,calc(100% - 20px));background:var(--zielen);color:var(--na-zieleni);border-radius:16px;padding:14px;box-shadow:var(--cien-2);display:grid;gap:10px}
.blisko p{margin:0;font-weight:600}
.blisko .btn{background:var(--na-zieleni);color:var(--zielen)}

/* ===== PUNKT GRY: HISTORIA I ZADANIA ===== */
.stacja-glowa{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.stacja-tytul{font-size:clamp(1.8rem,7vw,2.3rem);margin:.05em 0 .15em}
.historia p{font-size:1.06rem}
details.wiecej{margin:.3em 0 1em;border:1px solid var(--linia);border-radius:12px;padding:0 14px;background:var(--karta-2)}
details.wiecej summary{cursor:pointer;font-weight:700;padding:12px 0}
details.wiecej[open]{padding-bottom:6px}
#zadanie{scroll-margin-top:110px}
.karta-zadania{background:var(--karta);border:1px solid var(--linia);border-radius:var(--r);box-shadow:var(--cien-1);padding:16px}
.licznik{display:flex;justify-content:space-between;gap:8px;font-weight:600;color:var(--tekst-2);font-size:.9rem;margin-bottom:.4em}
.licznik .typ{color:var(--zielen-2);background:var(--zielen-jasna);padding:2px 9px;border-radius:999px}
.opcje{display:grid;gap:8px}
.opcja{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;padding:.7em .95em;font:inherit;line-height:1.35;color:var(--tekst);background:var(--karta-2);border:1.5px solid var(--linia);border-radius:12px;cursor:pointer}
.opcja:hover:not(:disabled){border-color:var(--kamien)}
.opcja:disabled{cursor:default}
.opcja.dobrze{border-color:var(--ok);background:var(--ok-tlo)}
.opcja.dobrze::after{content:"✓";color:var(--ok);font-weight:800}
.opcja.zle{border-color:var(--blad);background:var(--blad-tlo);color:var(--tekst-2)}
.opcja.zle::after{content:"✗";color:var(--blad);font-weight:800}
.opcja:disabled:not(.dobrze):not(.zle){opacity:.6}
.ulozone{margin:0 0 12px;padding:0 0 0 1.6em}
.ulozone:empty{display:none}
.ulozone li{padding:6px 0;border-bottom:1px dashed var(--linia);font-weight:500}
.foto-podglad img{display:block;width:100%;height:auto;border-radius:12px;margin:12px 0;border:1px solid var(--linia)}
.wiersz{display:flex;gap:8px}
.wiersz input{flex:1;min-width:0}
.wiersz .btn{flex:0 0 auto}
.wynik{margin-top:12px}
.wynik:empty{display:none}
.ok{color:var(--ok);font-weight:700}
.blad{color:var(--blad);font-weight:600}
.podpowiedz{border-left:3px solid var(--slonce);padding-left:10px}
.ciekawostka{background:var(--zielen-jasna);border-radius:10px;padding:10px 12px}
.koniec-zadan{text-align:center}
.koniec-zadan .pieczec{margin:0 auto 10px}
.zdobyta{display:flex;align-items:center;gap:12px;margin:.6em 0}
.zdobyta p{margin:0;font-weight:700}

/* ===== PIECZĘCIE (lak) I PIECZĄTKI (tusz) ===== */
.pieczec{display:block;flex:0 0 auto;overflow:visible}
.w-tlo{fill:var(--wosk)}
.w-ring{fill:none;stroke:var(--wosk-ciemny);stroke-width:2.6}
.w-blask{fill:none;stroke:var(--wosk-blask);stroke-width:1;opacity:.6}
.embl{fill:var(--wosk-ciemny);color:var(--wosk-ciemny)}
.w-odblask{fill:#fff;opacity:.18}
.pusta{color:var(--kamien)}
.embl-pusty{fill:currentColor;color:inherit;opacity:.35}
.tusz{color:var(--tusz)}
.pieczatka-svg{display:block;margin:0 auto 6px}
.ksiazeczka{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}
.strona-ks{background:var(--karta);border:1px solid var(--linia);border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--cien-1)}
.strona-ks p{margin:0}
.ks-nazwa{font-weight:700;line-height:1.25}
.pieczatki{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:14px}
.pieczatka{text-align:center;font-size:.93rem;line-height:1.35}
.pieczatka p{margin:0 0 .2em}
.przelacznik-tras{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}

/* ===== OKNA ===== */
.nakladka{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(10,20,14,.55);backdrop-filter:blur(2px)}
.okno{width:100%;max-width:26rem;background:var(--karta);color:var(--tekst);border-radius:20px;padding:24px 18px 18px;text-align:center;box-shadow:var(--cien-2)}
.okno-lewo{text-align:left}
.stempel{display:flex;justify-content:center;margin-bottom:8px}
.stempel svg{animation:stempel .65s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes stempel{0%{transform:scale(1.9) rotate(-20deg);opacity:0}55%{transform:scale(.9) rotate(5deg);opacity:1}100%{transform:none}}
.okno h2{margin:.1em 0 .3em;font-size:1.7rem}
.powiadomienie{text-align:left;background:var(--slonce-jasne);border:1.5px solid var(--slonce);border-radius:14px;padding:14px;margin-top:14px}
.pow-tytul{font-weight:700;color:var(--slonce-tekst);margin-bottom:.1em;font-size:.9rem}
.pow-nazwa{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem;line-height:1.15;margin-bottom:.35em}
.potw-tekst{font-size:1.1rem;font-weight:500}
.metoda{padding:14px 0;border-bottom:1px solid var(--linia)}
.metoda:last-of-type{border-bottom:0}
.metoda h3{margin:0 0 .3em;font-size:1.02rem}
.metoda p{font-size:.95rem}
.test{background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(242,178,58,.15) 10px 20px);padding:12px;border-radius:12px;margin-top:6px}

/* ===== PANEL ORGANIZATORA ===== */
.zakladki{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px 6px}
.zakladka{flex:0 0 auto;min-height:44px;padding:.45em .95em;border-radius:999px;border:1.5px solid var(--linia);background:var(--karta);font:inherit;font-weight:600;color:var(--tekst);cursor:pointer}
.zakladka[aria-selected=true]{background:var(--zielen);border-color:var(--zielen);color:var(--na-zieleni)}
.liczby{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.liczba{background:var(--karta);border:1px solid var(--linia);border-radius:14px;padding:12px;box-shadow:var(--cien-1)}
.liczba b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2rem;line-height:1.05}
.liczba span{font-size:.88rem;color:var(--tekst-2)}
.stat{margin:12px 0}
.stat p{margin:0 0 5px;font-size:.95rem;line-height:1.35}
.pasek{height:9px;background:var(--linia);border-radius:5px;overflow:hidden}
.pasek span{display:block;height:100%;background:var(--zielen)}
.karta-det{border:1px solid var(--linia);border-radius:12px;background:var(--karta);margin:8px 0;padding:0 14px}
.karta-det summary{cursor:pointer;padding:12px 0;font-weight:700;line-height:1.3}
.karta-det summary .drobne{font-weight:500}
.karta-det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font-size:.95rem}
.karta-det dt{color:var(--tekst-2)}
.karta-det dd{margin:0;overflow-wrap:anywhere}
.odp-lista{list-style:none;padding:0;margin:0 0 12px;font-size:.92rem}
.odp-lista li{padding:4px 0;border-top:1px dashed var(--linia)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:12px}
.galeria figure{margin:0}
.galeria img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--linia)}
.galeria figcaption{font-size:.82rem;color:var(--tekst-2);line-height:1.3;margin-top:4px}
textarea.csv{width:100%;min-height:10rem;font:.85rem/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--tekst);background:var(--karta);border:1.5px solid var(--linia);border-radius:12px;padding:8px}
.tablice{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));margin-top:10px}
.tablica{background:#fff;color:#111;border:2px solid #111;border-radius:12px;padding:16px;text-align:center;break-inside:avoid}
.tablica p{margin:0 0 .3em}
.tablica-nazwa{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.3rem;line-height:1.15}
.tablica .qr{display:grid;place-items:center;min-height:172px;margin:10px 0}
.tablica .qr img,.tablica .qr canvas{max-width:100%;height:auto}
.link-qr{word-break:break-all;font-size:.75rem;color:#444}

/* ===== STOPKA ZCK ===== */
.stopka{padding:26px 16px 30px;margin-top:28px;border-top:1px solid var(--linia);font-size:.95rem;color:var(--tekst-2);background:var(--karta)}
.zck-gora{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.zck-plakietka{flex:0 0 auto;display:grid;place-items:center;background:var(--plakietka);border:1px solid var(--linia);border-radius:18px;padding:10px 12px;box-shadow:var(--cien-1)}
.zck-plakietka .zck-logo{width:92px;height:auto}
.zck-plakietka.mala{border-radius:12px;padding:5px 7px}
.zck-plakietka.mala .zck-logo{width:44px}
.zck-logo{display:block;width:60px;height:auto;object-fit:contain}
.logo-tlo{fill:var(--zielen)}
.logo-ring{fill:none;stroke:var(--na-zieleni);stroke-width:1.2;opacity:.6}
.logo-txt{fill:var(--na-zieleni);font:800 19px "Bricolage Grotesque",sans-serif;text-anchor:middle}
.etykieta{display:block;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst-2);margin:0 0 .2em}
.zck-nazwa{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--tekst);font-size:1.3rem;line-height:1.15;margin:0 0 .15em;text-wrap:balance}
.zck-gora .drobne{margin:0}
.kontakty{display:grid;gap:2px;margin:0 0 14px;padding:0;list-style:none}
.kontakty li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px;border-bottom:1px dashed var(--linia);padding:4px 0}
.kontakty li:last-child{border-bottom:0}
.kontakty .k-etyk{flex:0 0 5.2rem;font-size:.85rem;font-weight:600;color:var(--tekst-2)}
.kontakty .k-wart{flex:1 1 10rem;min-width:0;color:var(--tekst);font-weight:600;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.kopiuj{flex:0 0 auto;min-height:36px;padding:.25em .8em;border-radius:999px;border:1.5px solid var(--linia);background:var(--karta-2);color:var(--tekst);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.kopiuj:hover{border-color:var(--kamien)}
.zck h3{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;color:var(--tekst);margin:22px 0 10px}
.mapa-zck{border-radius:var(--r);overflow:hidden}
.mapa-google{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--karta-2);border:1px solid var(--linia)}
.mapa-google iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapa-podpis{font-size:.85rem;margin:8px 0 0}
.mapa-link{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px 16px;border-radius:var(--r);border:1.5px solid var(--linia);background:linear-gradient(135deg,var(--niebo-jasne),var(--karta) 70%);color:var(--tekst);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
.mapa-link:hover{border-color:var(--niebo);box-shadow:var(--cien-1)}
.mapa-link:active{transform:scale(.99)}
.mapa-link-pin{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--wosk);color:#FFF6F2;box-shadow:0 6px 16px color-mix(in srgb,var(--wosk) 35%,transparent)}
.mapa-link-pin svg{width:28px;height:28px}
.mapa-link-tekst{display:grid;gap:2px;min-width:0}
.mapa-link-tytul{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.12rem;line-height:1.2;color:var(--tekst)}
.mapa-link-adres{font-weight:600;color:var(--tekst)}
.mapa-link-opis{font-size:.88rem;color:var(--tekst-2);line-height:1.35}
.mapa-link-strzalka{font-size:1.4rem;font-weight:700;color:var(--niebo)}
.dojazd{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));margin-top:12px}
.dojazd-karta{background:var(--karta-2);border:1px solid var(--linia);border-radius:14px;padding:12px 14px;min-width:0}
.dojazd-karta h4{display:flex;align-items:center;gap:8px;margin:0 0 .35em;font-size:1rem;color:var(--tekst);font-family:"Bricolage Grotesque",sans-serif}
.dojazd-karta h4 svg{width:22px;height:22px;flex:0 0 auto;color:var(--zielen)}
.dojazd-karta p{margin:0 0 .45em;font-size:.93rem;line-height:1.45}
.dojazd-karta p:last-child{margin-bottom:0}
.stopka-gra{margin:20px 0 .3em;padding-top:14px;border-top:1px dashed var(--linia);font-size:.9rem}
.stopka-linki{display:flex;gap:20px;flex-wrap:wrap;margin:0}
.stopka-autor{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--linia);font-size:.9rem;color:var(--tekst-2)}
.stopka-autor b{color:var(--tekst)}
.organizator{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:.95rem;color:var(--tekst-2)}
.organizator b{color:var(--tekst)}

/* ===== NOWE TYPY ZADAŃ ===== */
.zdania{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:10px}
.zdanie{border:1.5px solid var(--linia);border-radius:12px;padding:10px 12px;background:var(--karta-2)}
.zdanie p{margin:0 0 8px;font-weight:500;line-height:1.4}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf button{min-height:44px;border-radius:10px;border:1.5px solid var(--linia);background:var(--karta);color:var(--tekst);font:inherit;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s,transform .12s}
.pf button[aria-pressed=true]{background:var(--niebo-jasne);border-color:var(--niebo);color:var(--tekst);box-shadow:0 0 0 2px color-mix(in srgb,var(--niebo) 30%,transparent)}
.zdanie.dobrze .pf button[aria-pressed=true]{background:var(--ok-tlo);border-color:var(--ok);color:var(--ok);box-shadow:none}
.pary-siatka{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pary-kol{display:grid;gap:8px;align-content:start;min-width:0}
.para{position:relative;text-align:left;min-height:52px;padding:.55em .7em;border-radius:12px;border:1.5px solid var(--linia);background:var(--karta-2);color:var(--tekst);font:inherit;font-size:.93rem;line-height:1.3;cursor:pointer;transition:border-color .15s,background .15s,transform .12s;overflow-wrap:anywhere}
.para[aria-pressed=true]{border-color:var(--niebo);background:var(--niebo-jasne);box-shadow:0 0 0 3px color-mix(in srgb,var(--niebo) 25%,transparent)}
.para.dopasowana{border-color:var(--ok);background:var(--ok-tlo);cursor:default}
.para .nr-pary{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--karta);font-size:.75rem;font-weight:800;margin-right:6px;vertical-align:1px}
.szyfr{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.litera{display:grid;place-items:center;width:42px;height:50px;border-radius:10px;background:var(--karta-2);border:1.5px solid var(--linia);font:800 1.45rem/1 "Bricolage Grotesque",sans-serif;color:var(--tusz)}
.klucz{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px;padding:0;list-style:none}
.klucz li{font:800 .95rem/1 "Figtree",sans-serif;letter-spacing:.12em;padding:7px 10px;border-radius:8px;background:var(--slonce-jasne);color:var(--slonce-tekst);border:1px solid var(--slonce)}
.liczba-wiersz{display:flex;gap:8px;align-items:center}
.liczba-wiersz input{flex:1;min-width:0}
.liczba-wiersz .jedn{font-weight:700;color:var(--tekst-2)}

/* ===== TAJNE HASŁO ===== */
.haslo-karta{border:2px dashed var(--tusz)}
.sloty,.kafle{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.slot{display:grid;place-items:center;width:44px;height:52px;border-radius:10px;border:2px dashed var(--kamien);font:800 1.5rem/1 "Bricolage Grotesque",sans-serif;color:var(--tekst)}
.slot.pelny{border-style:solid;border-color:var(--tusz);background:var(--karta-2)}
.kafel{display:grid;place-items:center;min-width:44px;height:52px;padding:0 6px;border-radius:10px;border:1.5px solid var(--linia);background:var(--karta);font:800 1.5rem/1 "Bricolage Grotesque",sans-serif;color:var(--tusz);box-shadow:0 2px 0 var(--linia);cursor:pointer;transition:transform .12s}
.kafel:disabled{opacity:.25;cursor:default;box-shadow:none}
.kafel.pusty{color:var(--kamien);border-style:dashed;box-shadow:none;cursor:default}
.kafle-ks{display:flex;flex-wrap:wrap;gap:8px}
.kafle-ks .grupa{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--tekst-2)}
.kafle-ks .grupa div{display:flex;gap:4px}
.kafle-ks .kafel{min-width:38px;height:44px;font-size:1.25rem;cursor:default}

/* ===== FINAŁ I CERTYFIKAT ===== */
.final-baner{text-align:center;background:radial-gradient(120% 90% at 50% 0%,var(--slonce-jasne),var(--karta) 70%);border:2px solid var(--slonce);overflow:hidden;position:relative}
.final-baner h1{font-size:clamp(1.9rem,7vw,2.4rem);margin:.1em 0 .25em;text-wrap:balance}
.final-pieczecie{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.final-liczby{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.final-liczby div{background:var(--karta);border:1px solid var(--linia);border-radius:12px;padding:8px 6px}
.final-liczby dt{font-size:.78rem;color:var(--tekst-2);font-weight:600}
.final-liczby dd{margin:0;font:800 1.3rem/1.15 "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.cert-ramka{margin:12px 0 0;padding:10px;border-radius:var(--r);background:var(--karta-2);border:1px solid var(--linia);perspective:1200px}
.cert-obraz{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:297/210;border-radius:6px;background:var(--papier);box-shadow:0 10px 30px rgba(16,36,27,.22);transform-origin:50% 0}
.cert-obraz.gotowy{animation:rozwin .9s cubic-bezier(.2,.8,.2,1) both}
.cert-czeka{display:grid;place-items:center;aspect-ratio:297/210;border-radius:6px;background:var(--papier);color:#56645B;font-weight:600;border:1px dashed var(--kamien)}
.cert-ramka figcaption{font-size:.85rem;color:var(--tekst-2);margin-top:8px}

/* ===== ANIMACJE ===== */
@keyframes wjazd{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes wjazdBok{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes potrzas{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes plusPkt{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@keyframes pulsRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.45);opacity:0}}
@keyframes blysk{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(320%) skewX(-18deg)}}
@keyframes rozwin{from{opacity:0;transform:rotateX(-62deg) translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fala{to{stroke-dashoffset:-60}}
@keyframes chmury{from{transform:translateX(-10px)}to{transform:translateX(18px)}}
@keyframes ptaki{from{transform:translateX(-80px)}to{transform:translateX(440px)}}
@keyframes flaga{from{transform:skewY(0) scaleX(1)}to{transform:skewY(7deg) scaleX(.82)}}
@keyframes poswiata{from{transform:scale(1);opacity:.35}to{transform:scale(1.25);opacity:.12}}
@keyframes wskazowka{to{transform:rotate(360deg)}}
@keyframes zanik{from{opacity:0}to{opacity:1}}
@keyframes oknoWjazd{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fala-stempla{from{transform:scale(.6);opacity:.7}to{transform:scale(1.9);opacity:0}}
.wejscie > section:not(.hero) > *, .wejscie > section.hero .hero-tresc > *{animation:wjazd .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
.karta-zadania.nowe{animation:wjazdBok .42s cubic-bezier(.2,.7,.2,1) both}
.opcja.dobrze,.para.dopasowana,.zdanie.dobrze{animation:pop .35s ease}
.opcja.zle,.para.zle,.potrzas{animation:potrzas .42s ease}
.para.zle{border-color:var(--blad);background:var(--blad-tlo)}
.btn,.opcja,.kafel,.pf button,.para{-webkit-tap-highlight-color:transparent}
.btn:active:not(:disabled),.opcja:active:not(:disabled),.kafel:active:not(:disabled),.pf button:active,.para:active:not(.dopasowana){transform:scale(.97)}
.btn-glowny:hover,.btn-wosk:hover,.btn-slonce:hover{filter:brightness(1.05)}
.nag-punkty.bump{animation:bump .5s ease}
.plus-pkt{position:fixed;z-index:70;pointer-events:none;white-space:nowrap;font:800 1.35rem/1 "Bricolage Grotesque",sans-serif;color:var(--slonce-tekst);background:var(--slonce-jasne);border:2px solid var(--slonce);padding:6px 12px;border-radius:999px;box-shadow:var(--cien-1);animation:plusPkt 1.15s ease-out forwards}
.os li.aktualna .os-znak::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--slonce);animation:pulsRing 1.8s ease-out infinite}
.cel{position:relative;overflow:hidden}
.cel.swiezy::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--slonce) 22%,transparent),transparent);animation:blysk 1.2s .35s ease-out both;pointer-events:none}
.cel.swiezy .etykieta-cel{animation:bump .6s .2s ease both}
.postep span{background:linear-gradient(90deg,var(--zielen),var(--zielen-2),var(--zielen));background-size:200% 100%;animation:przesuw 3s linear infinite}
@keyframes przesuw{to{background-position:-200% 0}}
.nakladka:not([hidden]){animation:zanik .2s ease both}
.nakladka:not([hidden]) .okno{animation:oknoWjazd .38s cubic-bezier(.2,.9,.3,1.15) both}
.komunikat:not([hidden]){animation:toast .28s ease-out both}
.stempel{position:relative}
.stempel::before{content:"";position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:3px solid var(--wosk);animation:fala-stempla .9s .45s ease-out both;pointer-events:none}
.powiadomienie{animation:wjazd .5s .55s cubic-bezier(.2,.7,.2,1) both}
.nowe-litery{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.nowe-litery .kafel{animation:wjazd .4s both;animation-delay:calc(.7s + var(--i,0) * 120ms);cursor:default}
.final-pieczecie .pieczec{animation:stempel .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(.3s + var(--i,0) * 170ms)}
.strona-ks .pieczec:not(.pusta){transition:transform .25s}
.strona-ks:hover .pieczec:not(.pusta){transform:rotate(-6deg) scale(1.04)}
.i-chmura{animation:chmury 14s ease-in-out infinite alternate}
.i-chmura.druga{animation-duration:19s;animation-direction:alternate-reverse}
.i-poswiata{fill:#FFE7A1;transform-box:fill-box;transform-origin:center;animation:poswiata 3.5s ease-in-out infinite alternate}
.i-fala{fill:none;stroke:#FFFFFF;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:14 16;opacity:.75;animation:fala 3.2s linear infinite}
.i-ptaki{fill:none;stroke:#4E5A53;stroke-width:1.4;stroke-linecap:round;animation:ptaki 26s linear infinite}
.i-flaga{fill:#B3261E;transform-box:fill-box;transform-origin:0 50%;animation:flaga 1.6s ease-in-out infinite alternate}
.i-maszt{stroke:#4E5A53;stroke-width:1.2}
.i-wskazowka{stroke:#3E5B4D;stroke-width:1;stroke-linecap:round;transform-box:view-box;transform-origin:307px 101px;animation:wskazowka 12s linear infinite}
.konfetti{position:fixed;inset:0;width:100%;height:100%;z-index:65;pointer-events:none}

.komunikat{position:fixed;left:50%;transform:translateX(-50%);z-index:60;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(32rem,calc(100% - 28px));background:#15231A;color:#F2F6F1;padding:12px 16px;border-radius:12px;box-shadow:var(--cien-2);font-weight:500;line-height:1.4}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  body{background:#fff;color:#000}
  .naglowek,.stopka,.komunikat,.nakladka,.nawigacja,.blisko,.nie-drukuj,.konfetti,.plus-pkt{display:none!important}
  body.z-nawigacja .aplikacja{padding-bottom:0}
  *{animation:none!important}
  body.druk-cert .aplikacja{max-width:none}
  body.druk-cert main .final > :not(.cert-ramka){display:none!important}
  body.druk-cert .cert-ramka{margin:0;padding:0;border:0;background:none}
  body.druk-cert .cert-ramka figcaption{display:none}
  body.druk-cert .cert-obraz{width:100%;height:auto;box-shadow:none;border-radius:0}
  body.druk-cert .sekcja{padding:0}
  .tablice{grid-template-columns:1fr 1fr}
}
</style>
</head>

   ========================================================= */
let chmura = null;
let timerChmury = null, ostatnioWyslane = "", kolejkaChmury = Promise.resolve();

async function uzyj(nazwa) {
  try { if (!window.claude || typeof window.claude.use !== "function") return null; return await window.claude.use(nazwa); }
  catch (e) { return null; }
}
function zCzasem(p, ms) { return Promise.race([p, new Promise((_, nie) => setTimeout(() => nie({ code: "timeout" }), ms || 15000))]); }
async function initChmury() {
  const [db, user] = await Promise.all([uzyj("db"), uzyj("user")]);
  if (!db) return;
  let uid = null, admin = false;
  try { if (user) { uid = await user.id(); admin = await user.canEdit(); } } catch (e) {}
  chmura = { db, uid, admin, docIstnieje: null, zapisZablokowany: !uid };
  if (stan.id) zaplanujChmure();
  if (widokTymczasowy === "organizator") { orgDane = null; render(); }
}
function zaplanujChmure() {
  if (!chmura || chmura.zapisZablokowany || !stan.id) return;
  clearTimeout(timerChmury);
  timerChmury = setTimeout(() => {
    const rek = rekord(), sygn = JSON.stringify(rek);
    if (sygn === ostatnioWyslane) return;
    kolejkaChmury = kolejkaChmury.then(() => wyslijRekord(rek, sygn)).catch(() => {});
  }, 800);
}
async function wyslijRekord(rek, sygn) {
  const ref = chmura.db.doc("druzyny/" + chmura.uid);
  try {

function widokTrasy() {
  const t = trasa(), c = cel(), st = t.stacje, n = st.length;
  const k = stan.ukonczone.filter(id => st.some(s => s.id === id)).length;
  const wTrakcie = stan.aktywna === c.id;
  const lista = st.map((s, i) => {
    const zdobyta = stan.ukonczone.includes(s.id), aktualna = s.id === c.id;
    return `<li class="${zdobyta ? "zdobyta" : aktualna ? "aktualna" : "zablokowana"}">
      <span class="os-znak">${zdobyta ? pieczec(s.pieczec, true, 44) : i + 1}</span>
      <div><p class="os-nazwa">${esc(s.nazwa)}</p>

        ${zdobyta ? `<button class="link" type="button" data-akcja="historia" data-id="${s.id}">Przeczytajcie historię jeszcze raz</button>` : ""}</div></li>`;
  }).join("");
  return `<section class="sekcja">
    <div class="karta podsumowanie">
      <div style="flex:1"><p class="drobne" style="margin:0">${esc(t.nazwa)}, tryb: ${TRYBY[stan.tryb].nazwa.toLowerCase()}</p>

      <div class="pieczecie-wiersz">${st.map(x => pieczec(x.pieczec, stan.ukonczone.includes(x.id), 26)).join("")}</div>
    </div>
    <div class="karta cel${odblokowano === c.id ? " swiezy" : ""}" style="margin-top:12px">
      <span class="etykieta-cel">Wasz cel: punkt ${indeks(c) + 1} z ${n}</span>
      <h2>${esc(c.nazwa)}</h2>
      <p class="miejsce">${esc(c.miejsce)}</p>
      ${c.zapowiedz ? `<p class="zapowiedz">${c.zapowiedz}</p>` : ""}
      ${c.wskazowka ? `<p class="wskazowka">${c.wskazowka}</p>` : ""}

      </div>
    </div>
    <h2>Punkty trasy</h2>
    <ol class="os">${lista}</ol>
  </section>`;
}

async function usunDruzyne(id) {

  try {

    dousu.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  if (stan.id === id) { stan = nowyStan(); piszJSON(KLUCZ_STANU, stan); }

      const zs = await zCzasem(chmura.db.collection(`druzyny/${g.uid}/zdjecia`).where("gra", "==", id).get());

  if (h === "organizator") { widokTymczasowy = "organizator"; render(); return; }
  if (h === "form-start") return;
  // Kody QR prowadzą pod adres z „#kod-HASLO” (taki adres działa też w claude.ai); starsze „#kod=HASLO” też są obsługiwane.
  const kod = /^kod-/i.test(h) ? h.slice(4) : new URLSearchParams(h).get("kod");
  if (kod) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} przyjmijKod(kod, "qr"); }
}
window.addEventListener("hashchange", obsluzAdres);

document.getElementById("stopka-zck").innerHTML = stopkaZCK();
odswiezMapeZCK();
sprawdzGoogle();
render();
obsluzAdres();
initChmury();
</script>
